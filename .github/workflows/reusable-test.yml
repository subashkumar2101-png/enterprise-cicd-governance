name: "Reusable Code Quality & Test Engine"

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
    outputs:
      test-status:
        description: "Outcome of the test run"
        value: ${{ jobs.test.outputs.status }}

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.record-status.outputs.status }}
    
    # Restrict permissions following the principle of least privilege
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run Linters & Tests
        run: npm test --if-present

      - name: Record Execution Status
        id: record-status
        if: always()
        run: echo "status=success" >> $GITHUB_OUTPUT
